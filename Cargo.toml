[workspace]
resolver = "2"
members = [
    "zip-rs",
    "zip-rs-macros",
    "examples/hello",
    "examples/validate-email",
    "examples/policy-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hanzoai/zip-rs"
homepage = "https://github.com/hanzoai/zip-rs"

[workspace.dependencies]
zip-rs = { path = "zip-rs", version = "0.1.0" }
zip-rs-macros = { path = "zip-rs-macros", version = "0.1.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
syn = { version = "2.0.106", features = ["full"] }
quote = "1.0.40"
proc-macro2 = "1.0.95"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
